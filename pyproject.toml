[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wintd"
version = "0.1.0"
description = "fast vision sidecar for touchdesigner on windows"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9,<3.13"
dependencies = [
  "numpy==1.26.4",
  "opencv-contrib-python==4.10.0.84",
  "mediapipe==0.10.14",
]

[project.optional-dependencies]
windows = ["onnxruntime-directml==1.18.0", "SpoutGL", "cv2_enumerate_cameras"]
posix = ["onnxruntime==1.18.0", "cv2_enumerate_cameras"]

[project.scripts]
wintd = "wintd.cli:main"

[tool.setuptools]
packages = ["wintd"]
